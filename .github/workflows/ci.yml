name: test mi-calculadora-basica-tdd
on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      - uses: actions/chackout@v4

      - name: Use Node.js 20
      - uses: actions/setup-node@v4
      with: 
        node-version: '20'
        cache: 'npm'

      - name: install dependencies (lockfile)
        run: npm ci

      - name: Run test
        run: npm test